plugins {
    id 'java'
}

group = 'ru.soscreate'
version = '1.30.1'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.register('generateAstralResourcePack', Exec) {
    workingDir projectDir
    commandLine 'python', 'tools/generate_resource_pack.py'
    inputs.file('tools/generate_resource_pack.py')
    outputs.file('src/main/resources/resource-pack.zip')
}

processResources {
    dependsOn tasks.named('generateAstralResourcePack')
    filteringCharset = 'UTF-8'
}
