name: AstralNexusRPG
version: 1.34.0
main: ru.soscreate.astralnexus.AstralNexusPlugin
api-version: '1.21.4'
author: sos-create
description: Six protected cave maps with tested wave and boss spawns, an optional resource-pack prompt on join and co-op dungeon runs for Paper 1.21.4.
commands:
  astral:
    description: Astral Nexus RPG menu and commands
    usage: /astral [menu|start|profile|choose|skill|cast|quest|help]
    aliases: [anexus, an]
permissions:
  astralnexus.use:
    description: Use Astral Nexus RPG
    default: true
  astralnexus.admin:
    description: Manage Astral Nexus RPG
    default: op
