# Astral Nexus RPG 1.25.0
# Embedded resource pack is extracted automatically; players must accept it before use.
# localhost works only when Paper and the Minecraft client run on the same computer.
resource-pack:
  public-url: "http://127.0.0.1:8123/astral-pack.zip"
  server-port: 8123
# Remote players: set public-url to the server's public IP/domain and forward TCP 8123.
