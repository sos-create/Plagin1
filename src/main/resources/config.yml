# Astral Nexus RPG 1.13.0
# Textures are embedded in the plugin JAR and extracted automatically.
# This default works when the server and Minecraft client run on the SAME computer.
resource-pack:
  public-url: "http://127.0.0.1:8123/astral-pack.zip"
  server-port: 8123
# For remote players, replace 127.0.0.1 with the server's public IP/domain
# and make TCP port 8123 reachable from the Internet.
