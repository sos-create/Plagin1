name: Build Astral Nexus RPG
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build plugin
        run: gradle clean build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstralNexusRPG-Paper-1.21.4
          path: build/libs/*.jar
      - name: Assemble one-click Windows test server
        shell: bash
        run: |
          mkdir -p portable-server/plugins
          cp build/libs/*.jar portable-server/plugins/AstralNexusRPG.jar
          cp server/START.bat server/start-server.ps1 server/README.txt portable-server/
      - name: Upload one-click Windows test server
        uses: actions/upload-artifact@v4
        with:
          name: AstralNexusRPG-Portable-Server-Windows
          path: portable-server/
