name: Build Astral Nexus RPG
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Build plugin
        run: gradle clean build
      - name: Build Fabric inventory button mod
        run: gradle -p client-mod clean build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstralNexusRPG-Paper-1.21.4
          path: build/libs/*.jar
      - name: Upload Fabric client mod
        uses: actions/upload-artifact@v4
        with:
          name: AstralNexus-Inventory-Button-Fabric-1.21.4
          path: client-mod/build/libs/AstralNexusInventoryButton-1.0.0.jar
