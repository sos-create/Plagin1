name: Build Astral Nexus RPG
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Build plugin and generate embedded textures
        run: gradle clean build
      - name: Validate 1.21.4 GUI and dungeon relic textures
        run: |
          python - <<'PY'
          import json
          import struct
          import zipfile
          from pathlib import Path

          jar = next(Path("build/libs").glob("*.jar"))
          with zipfile.ZipFile(jar) as plugin:
              assert "resource-pack.zip" in plugin.namelist(), "Embedded resource pack missing from JAR"
              data = plugin.read("resource-pack.zip")
          pack_path = Path("build/embedded-resource-pack.zip")
          pack_path.write_bytes(data)

          icon_names = ["home","profile","class","skills","quests","abilities","economy","shop","close","menu_token","quick_item","locked","experience","mana","mage","warrior","ranger","guardian","quest_hunt","quest_slayer","quest_miner","quest_lumber","quest_farmer","quest_fisher","ability_arcane","ability_blade","ability_arrow","ability_aegis","path_flow","path_seal","path_resonance","path_tempo","shop_food","shop_arrows","shop_pearl","shop_carrot","shop_apple","shop_xp","shop_blade","shop_shield","shop_diamond","shop_fish","shop_rocket","shop_totem","dungeon_key","void_blade","astral_flask","boss_relic","ability_nova","ability_prism","ability_blink","ability_mana","ability_spin","ability_charge","ability_roar","ability_guard","ability_volley","ability_snare","ability_dash","ability_mark","ability_heal","ability_aegis","ability_quake","ability_rally"]
          with zipfile.ZipFile(pack_path) as pack:
              assert pack.testzip() is None, "Embedded resource pack ZIP is corrupted"
              names = set(pack.namelist())
              assert not any(name.startswith("assets/minecraft/") for name in names), (
                  "The RPG pack must never override vanilla item models or textures"
              )

              required = [
                  "pack.mcmeta",
                  "assets/astral/font/gui.json",
                  "assets/astral/textures/font/equipment.png",
                  "assets/astral/textures/font/skills.png",
                  "assets/astral/textures/font/profile.png",
                  "assets/astral/textures/font/class.png",
                  "assets/astral/textures/font/quests.png",
                  "assets/astral/textures/font/abilities.png",
                  "assets/astral/textures/font/economy.png",
                  "assets/astral/textures/font/shop.png",
              ]
              for name in icon_names:
                  required.extend([
                      f"assets/astral/items/icons/{name}.json",
                      f"assets/astral/models/item/{name}.json",
                      f"assets/astral/textures/item/{name}.png",
                  ])
              missing = sorted(set(required) - names)
              assert not missing, f"Missing namespaced icon resources: {missing}"

              pack_meta = json.loads(pack.read("pack.mcmeta"))
              assert pack_meta["pack"]["pack_format"] == 46, "Wrong resource-pack format for Minecraft 1.21.4"

              font = json.loads(pack.read("assets/astral/font/gui.json"))
              bitmap_providers = [p for p in font["providers"] if p.get("type") == "bitmap"]
              assert len(bitmap_providers) == 8, "Expected eight full-window GUI background textures"
              assert all(p.get("height") == 222 and p.get("ascent") == 13 for p in bitmap_providers)

              for name in required:
                  if name.endswith(".png"):
                      image = pack.read(name)
                      assert image[:8] == b"\x89PNG\r\n\x1a\n", f"Invalid PNG: {name}"
                      width, height = struct.unpack(">II", image[16:24])
                      if "/font/" in name:
                          assert (width, height) == (176, 222), (name, width, height)
                      elif "/item/" in name:
                          assert (width, height) == (96, 96), (name, width, height)

              for icon_name in icon_names:
                  item_def_path = f"assets/astral/items/icons/{icon_name}.json"
                  item_def = json.loads(pack.read(item_def_path))
                  assert item_def["model"]["type"] == "minecraft:model"
                  assert item_def["model"]["model"] == f"astral:item/{icon_name}", (
                      f"Broken item_model definition: {icon_name}"
                  )

                  model_path = f"assets/astral/models/item/{icon_name}.json"
                  model = json.loads(pack.read(model_path))
                  assert model["parent"] == "minecraft:item/generated"
                  assert model["textures"]["layer0"] == f"astral:item/{icon_name}", (
                      f"Broken texture reference: {icon_name}"
                  )

          print(f"Validated {jar.name}: namespaced GUI items, {len(icon_names)} custom icons, no vanilla overrides.")
          PY
      - name: Validate long dry cave routes
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          required = [
              "private void addLongCaveRoute",
              "private void addSideGrotto",
              "private void addFinalSanctum",
              "private void clearDungeonRegionInBatches",
              "dungeon-world-reset-1.24.done",
              "activeMapOwners",
              "ENCOUNTER_Z = {-28, -67, -104}",
          ]
          missing = [item for item in required if item not in source]
          assert not missing, f"Missing cave route features: {missing}"
          assert "Material.WATER" not in source, "Dungeon generator still contains water blocks"
          assert "buildTreasureCavern" not in source and "buildCrystalCavern" not in source, (
              "Legacy room generators are still present"
          )
          start = int(re.search(r"ROUTE_ENTRY_Z = (-?\d+)", source).group(1))
          end = int(re.search(r"ROUTE_END_Z = (-?\d+)", source).group(1))
          assert start - end >= 150, f"Cave route too short: {start - end} blocks"
          print(f"Validated 3 long dry cave routes, {start - end} blocks between entry and final cavern, clean per-run regeneration.")
          PY
      - name: Validate dungeon access items and cave boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          required = [
              "private boolean upgradeOrCreateMarkedItem",
              "inventory.getStorageContents()",
              "inventory.getItemInOffHand()",
              "if (found) return true;",
              "private void addDecoratedCaveEdgeWalls",
              "addDecoratedCaveEdgeWalls(blocks, mapIndex, z, routeX, width, seed)",
              "A closed, decorated boundary wall follows the local terrain around the whole final cavern.",
              "Closed, solid perimeter walls follow the grotto",
          ]
          missing = [item for item in required if item not in source]
          assert not missing, f"Missing item/wall behavior: {missing}"
          assert source.count("ensureSpecialItems(") == 2, (
              "Expected one declaration and one call at adventure start; duplicate issue calls remain"
          )
          assert "Material.WATER" not in source, "Dungeon generator must stay dry"
          print("Validated: exactly-once access item checks, continuous cave edge walls, side-grotto walls and dry maps.")
          PY
      - name: Validate exactly four elevation-changing cave routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          import re

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          centers = re.search(r"MAP_CENTERS = [{]([^}]+)[}]", source)
          names = re.search(r"MAP_NAMES = [{]([^}]+)[}]", source)
          assert centers and names, "Dungeon map registry not found"
          assert len([x for x in centers.group(1).split(",") if x.strip()]) == 4, "Expected exactly four map regions"
          assert len(re.findall(r'"[^"]+"', names.group(1))) == 4, "Expected exactly four named maps"

          required = [
              "private double smoothCaveProfile",
              "private int caveFloorY",
              "int floorY = caveFloorY(mapIndex, z);",
              "for (int y = 37; y < floorY; y++) put(blocks, x, y, z, underfloor);",
              "for (int y = 37; y < floorY - 1; y++) put(blocks, x, y, z, underfloor);",
              "for (int y = 37; y < localFloor; y++)",
              "caveFloorY(mapIndex, BOSS_Z) + 1",
              "caveFloorY(mapIndex, (int) arenaZ) + 1",
              "int floorY = caveFloorY(mapIndex, localZ);",
              "int localFloor = caveFloorY(mapIndex, wallZ);",
          ]
          missing = [item for item in required if item not in source]
          assert not missing, f"Missing terrain-following cave logic: {missing}"
          assert "Material.WATER" not in source, "Dungeon generator must stay dry"

          entry, end, base = 23, -134, 69
          profiles = [
              lambda t: -13.0 * math.sin(math.pi*t)**2 + 1.45*math.sin(4*math.pi*t)*math.sin(math.pi*t),
              lambda t: -15.5 * math.sin(math.pi*t)**2 + 1.65*math.sin(6*math.pi*t)*math.sin(math.pi*t),
              lambda t: -14.0 * math.sin(math.pi*t)**2 + 1.80*math.sin(8*math.pi*t)*math.sin(math.pi*t),
          ]
          for index, profile in enumerate(profiles):
              heights = []
              for z in range(entry, end - 1, -1):
                  t = max(0.0, min(1.0, (entry - z)/(entry-end)))
                  heights.append(base + math.floor(profile(t) + 0.5))
              assert heights[0] == base and heights[-1] == base, f"Map {index} entry/exit mismatch"
              assert min(heights) <= 56, f"Map {index} does not descend enough"
              assert max(abs(a-b) for a,b in zip(heights, heights[1:])) <= 1, f"Map {index} has an abrupt vertical break"
              assert any(b < a for a,b in zip(heights, heights[1:])), f"Map {index} has no descent"
              assert any(b > a for a,b in zip(heights, heights[1:])), f"Map {index} has no ascent"

          print("Validated exactly four dry cave maps, gradual 13–20 block descents, smooth one-block transitions, solid underfloor and terrain-aware mob spawns.")
          PY
      - name: Validate class shops, skill duration cap and dungeon encounters
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          for archetype in ("mage", "warrior", "ranger", "guardian"):
              assert f'case "{archetype}" -> List.of(' in source, f"Missing {archetype} shop"
          assert source.count("new ShopProduct(") == 48, "Expected 12 distinct products for each of four classes"
          assert "shopProducts(getString(p, classKey, \"\"))" in source, "Shop purchases must use the selected class"
          assert "available.remove(previousMap)" in source, "Consecutive identical maps are not excluded"
          assert "private Material caveUnderfloor" in source and "case 3 ->" in source, "Fourth cave material profile missing"

          start = source.index("private void castAbility")
          end = source.index("private void quest", start)
          ability_code = source[start:end]
          assert "private int skillEffectTicks" in source and "Math.min(300" in source, "15-second skill cap missing"
          assert ability_code.count("new PotionEffect(") == ability_code.count("skillEffectTicks("), (
              "A player-skill potion effect is not routed through the 300-tick cap"
          )

          required_encounters = [
              'player.sendTitle("§6§lВОЛНА "',
              'player.sendTitle("§4§lБОСС"',
              "private void startBossPulse",
              "onDungeonBossPhaseDamage",
              "bossPhaseKey",
              "Attribute.KNOCKBACK_RESISTANCE",
          ]
          missing = [name for name in required_encounters if name not in source]
          assert not missing, f"Missing wave/boss mechanics: {missing}"
          print("Validated four class-specific 12-item shops, no consecutive map repeats, 300-tick skill effects, three wave titles and a phased boss.")
          PY
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstralNexusRPG-Paper-1.21.4
          path: build/libs/*.jar
