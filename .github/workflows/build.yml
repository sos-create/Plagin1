name: Build Astral Nexus RPG
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Build plugin and generate embedded textures
        run: gradle clean build
      - name: Validate embedded resource pack
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          jar = next(Path("build/libs").glob("*.jar"))
          with zipfile.ZipFile(jar) as plugin:
              data = plugin.read("resource-pack.zip")
          pack_path = Path("build/embedded-resource-pack.zip")
          pack_path.write_bytes(data)
          with zipfile.ZipFile(pack_path) as pack:
              assert pack.testzip() is None, "Resource pack ZIP is corrupted"
              required = [
                  "pack.mcmeta",
                  "assets/astral/font/gui.json",
                  "assets/astral/textures/font/equipment.png",
                  "assets/astral/textures/font/skills.png",
                  "assets/astral/textures/font/profile.png",
                  "assets/astral/textures/font/class.png",
                  "assets/astral/textures/font/quests.png",
                  "assets/astral/textures/font/abilities.png",
                  "assets/astral/textures/item/shield.png",
                  "assets/astral/textures/item/sword.png",
                  "assets/astral/textures/item/ring.png",
                  "assets/astral/textures/item/amulet.png",
                  "assets/astral/textures/item/orb.png",
                  "assets/astral/textures/item/belt.png",
                  "assets/astral/textures/item/cloak.png",
                  "assets/astral/textures/item/rune.png",
                  "assets/astral/textures/item/relic.png",
                  "assets/astral/textures/item/flame.png",
                  "assets/astral/textures/item/shard.png",
                  "assets/astral/textures/item/chronometer.png",
                  "assets/astral/textures/item/bow.png",
                  "assets/astral/textures/item/home.png",
                  "assets/astral/textures/item/profile.png",
                  "assets/astral/textures/item/class.png",
                  "assets/astral/textures/item/skills.png",
                  "assets/astral/textures/item/quests.png",
                  "assets/astral/textures/item/abilities.png",
                  "assets/astral/textures/item/menu_token.png",
                  "assets/astral/textures/item/quick_item.png",
                  "assets/astral/models/item/home.json",
                  "assets/astral/models/item/profile.json",
                  "assets/astral/models/item/class.json",
                  "assets/astral/models/item/skills.json",
                  "assets/astral/models/item/quests.json",
                  "assets/astral/models/item/abilities.json",
                  "assets/astral/models/item/menu_token.json",
                  "assets/astral/models/item/quick_item.json",
                  "assets/minecraft/models/item/compass.json",
                  "assets/minecraft/models/item/paper.json",
                  "assets/minecraft/models/item/ender_eye.json",
                  "assets/minecraft/models/item/enchanted_book.json",
                  "assets/minecraft/models/item/writable_book.json",
                  "assets/minecraft/models/item/blaze_rod.json",
                  "assets/minecraft/models/item/recovery_compass.json",
                  "assets/minecraft/models/item/nether_star.json",
                  "assets/minecraft/models/item/feather.json",
              ]
              missing = [name for name in required if name not in pack.namelist()]
              assert not missing, f"Missing resource-pack files: {missing}"
              import json
              meta = json.loads(pack.read("pack.mcmeta"))
              assert meta["pack"]["pack_format"] == 46
              font = json.loads(pack.read("assets/astral/font/gui.json"))
              space = next(p for p in font["providers"] if p["type"] == "space")
              assert space["advances"].get("\uf808") == -8, "GUI horizontal inset is not corrected"
              bitmaps = [p for p in font["providers"] if p["type"] == "bitmap"]
              assert len(bitmaps) == 6 and all(p["ascent"] == 13 and p["height"] == 222 for p in bitmaps)
              import struct
              for name in required:
                  if name.endswith(".png"):
                      image = pack.read(name)
                      assert image[:8] == b"\x89PNG\r\n\x1a\n", f"Invalid PNG: {name}"
                      size = struct.unpack(">II", image[16:24])
                      if "/font/" in name:
                          assert size == (176, 222), (name, size)
                      elif "/item/" in name:
                          assert size == (32, 32), (name, size)
              models = {
                  "compass.json": 1301,
                  "paper.json": 1302,
                  "ender_eye.json": 1303,
                  "enchanted_book.json": 1304,
                  "writable_book.json": 1305,
                  "blaze_rod.json": 1306,
                  "recovery_compass.json": 1308,
              }
              for filename, model_data in models.items():
                  data = json.loads(pack.read("assets/minecraft/models/item/" + filename))
                  assert any(x["predicate"].get("custom_model_data") == model_data
                             for x in data["overrides"]), f"Missing custom item model: {filename}"
              star = json.loads(pack.read("assets/minecraft/models/item/nether_star.json"))
              assert any(x["predicate"].get("custom_model_data") == 1307 for x in star["overrides"])
              for model_name in ["menu_token", "quick_item", "home", "profile", "class", "skills", "quests", "abilities"]:
                  model = json.loads(pack.read("assets/astral/models/item/" + model_name + ".json"))
                  namespace, texture_path = model["textures"]["layer0"].split(":", 1)
                  texture_file = f"assets/{namespace}/textures/{texture_path}.png"
                  assert texture_file in pack.namelist(), f"Missing model texture: {texture_file}"
          print(f"Validated {jar.name}: {len(data)} embedded resource-pack bytes")
          PY
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstralNexusRPG-Paper-1.21.4
          path: build/libs/*.jar
