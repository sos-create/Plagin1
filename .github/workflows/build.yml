name: Build Astral Nexus RPG
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Build plugin and generate embedded textures
        run: gradle clean build
      - name: Verify JAR and public resource-pack bytes are identical
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          jar = next(Path("build/libs").glob("*.jar"))
          with zipfile.ZipFile(jar) as plugin:
              embedded = plugin.read("resource-pack.zip")
          generated_path = Path("src/main/resources/resource-pack.zip")
          generated = generated_path.read_bytes()
          assert embedded == generated, "JAR does not contain the generated resource pack byte-for-byte"
          first_hash = hashlib.sha1(generated).hexdigest()
          subprocess.run([sys.executable, "tools/generate_resource_pack.py"], check=True)
          regenerated = generated_path.read_bytes()
          assert regenerated == generated, "Resource-pack generator is not deterministic"
          assert hashlib.sha1(regenerated).hexdigest() == first_hash
          print(f"Verified exact resource-pack bytes and stable SHA-1: {first_hash}")
          PY
      - name: Smoke-test plugin startup on real Paper 1.21.4
        run: |
          set -euo pipefail
          mkdir -p .runtime-smoke/plugins
          cp build/libs/*.jar .runtime-smoke/plugins/
          echo 'eula=true' > .runtime-smoke/eula.txt

          ua="AstralNexusRPG-CI/1.0 (https://github.com/sos-create/Plagin1)"
          paper_url="$(curl -fsSL -H "User-Agent: $ua" \
            'https://fill.papermc.io/v3/projects/paper/versions/1.21.4/builds?channel=STABLE&limit=1' \
            | python -c 'import json,sys; print(json.load(sys.stdin)[0]["downloads"]["server:default"]["url"])')"
          curl -fsSL -H "User-Agent: $ua" "$paper_url" -o .runtime-smoke/paper.jar

          (
            cd .runtime-smoke
            mkfifo server.stdin
            timeout --signal=INT 120s java -Xms512M -Xmx1G -jar paper.jar --nogui \
              < server.stdin > server.log 2>&1 &
            server_pid=$!
            exec 3>server.stdin

            loaded=0
            for attempt in $(seq 1 90); do
              if grep -q "Astral Nexus RPG enabled for Paper 1.21.4" server.log; then
                loaded=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat server.log
                exit 1
              fi
              sleep 2
            done

            if [ "$loaded" -ne 1 ]; then
              echo "Paper server did not enable Astral Nexus RPG."
              cat server.log
              exit 1
            fi

            grep -F "Enabling AstralNexusRPG v1.35.0" server.log
            grep -F "Astral Nexus RPG enabled for Paper 1.21.4" server.log
            echo stop >&3
            wait "$server_pid"
            exec 3>&-
            grep -F "Done (" server.log
          )
      - name: Validate 1.21.4 GUI and dungeon relic textures
        run: |
          python - <<'PY'
          import json
          import struct
          import zipfile
          from pathlib import Path

          jar = next(Path("build/libs").glob("*.jar"))
          with zipfile.ZipFile(jar) as plugin:
              assert "resource-pack.zip" in plugin.namelist(), "Embedded resource pack missing from JAR"
              data = plugin.read("resource-pack.zip")
          pack_path = Path("build/embedded-resource-pack.zip")
          pack_path.write_bytes(data)

          icon_names = ["home","profile","class","skills","quests","abilities","economy","shop","close","menu_token","quick_item","locked","experience","mana","mage","warrior","ranger","guardian","quest_hunt","quest_slayer","quest_miner","quest_lumber","quest_farmer","quest_fisher","ability_arcane","ability_blade","ability_arrow","ability_aegis","path_flow","path_seal","path_resonance","path_tempo","shop_food","shop_arrows","shop_pearl","shop_carrot","shop_apple","shop_xp","shop_blade","shop_shield","shop_diamond","shop_fish","shop_rocket","shop_totem","dungeon_key","void_blade","astral_flask","boss_relic","ability_nova","ability_prism","ability_blink","ability_mana","ability_spin","ability_charge","ability_roar","ability_guard","ability_volley","ability_snare","ability_dash","ability_mark","ability_heal","ability_aegis","ability_quake","ability_rally"]
          with zipfile.ZipFile(pack_path) as pack:
              assert pack.testzip() is None, "Embedded resource pack ZIP is corrupted"
              names = set(pack.namelist())
              assert not any(name.startswith("assets/minecraft/") for name in names), (
                  "The RPG pack must never override vanilla item models or textures"
              )

              required = [
                  "pack.mcmeta",
                  "assets/astral/font/gui.json",
                  "assets/astral/textures/font/equipment.png",
                  "assets/astral/textures/font/skills.png",
                  "assets/astral/textures/font/profile.png",
                  "assets/astral/textures/font/class.png",
                  "assets/astral/textures/font/quests.png",
                  "assets/astral/textures/font/abilities.png",
                  "assets/astral/textures/font/economy.png",
                  "assets/astral/textures/font/shop.png",
              ]
              for name in icon_names:
                  required.extend([
                      f"assets/astral/items/icons/{name}.json",
                      f"assets/astral/models/item/{name}.json",
                      f"assets/astral/textures/item/{name}.png",
                  ])
              missing = sorted(set(required) - names)
              assert not missing, f"Missing namespaced icon resources: {missing}"

              pack_meta = json.loads(pack.read("pack.mcmeta"))
              assert pack_meta["pack"]["pack_format"] == 46, "Wrong resource-pack format for Minecraft 1.21.4"

              font = json.loads(pack.read("assets/astral/font/gui.json"))
              bitmap_providers = [p for p in font["providers"] if p.get("type") == "bitmap"]
              assert len(bitmap_providers) == 8, "Expected eight full-window GUI background textures"
              assert all(p.get("height") == 222 and p.get("ascent") == 13 for p in bitmap_providers)

              for name in required:
                  if name.endswith(".png"):
                      image = pack.read(name)
                      assert image[:8] == b"\x89PNG\r\n\x1a\n", f"Invalid PNG: {name}"
                      width, height = struct.unpack(">II", image[16:24])
                      if "/font/" in name:
                          assert (width, height) == (176, 222), (name, width, height)
                      elif "/item/" in name:
                          assert (width, height) == (96, 96), (name, width, height)

              for icon_name in icon_names:
                  item_def_path = f"assets/astral/items/icons/{icon_name}.json"
                  item_def = json.loads(pack.read(item_def_path))
                  assert item_def["model"]["type"] == "minecraft:model"
                  assert item_def["model"]["model"] == f"astral:item/{icon_name}", (
                      f"Broken item_model definition: {icon_name}"
                  )

                  model_path = f"assets/astral/models/item/{icon_name}.json"
                  model = json.loads(pack.read(model_path))
                  assert model["parent"] == "minecraft:item/generated"
                  assert model["textures"]["layer0"] == f"astral:item/{icon_name}", (
                      f"Broken texture reference: {icon_name}"
                  )

          print(f"Validated {jar.name}: namespaced GUI items, {len(icon_names)} custom icons, no vanilla overrides.")
          PY
      - name: Validate long dry cave routes
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          required = [
              "private void addLongCaveRoute",
              "private void addSideGrotto",
              "private void addFinalSanctum",
              "private void clearDungeonRegionInBatches",
              "Existing AstralNexusDungeon world data will be preserved",
              "activeMapOwners",
              "ENCOUNTER_Z = {-20, -43, -66, -89, -111}",
          ]
          missing = [item for item in required if item not in source]
          assert not missing, f"Missing cave route features: {missing}"
          assert "Material.WATER" not in source, "Dungeon generator still contains water blocks"
          assert "resetDungeonWorldOnce" not in source, "Startup still contains destructive whole-world reset logic"
          assert "Files.walk(worldFolder)" not in source, "Startup must never recursively delete the dungeon world"
          assert "buildTreasureCavern" not in source and "buildCrystalCavern" not in source, (
              "Legacy room generators are still present"
          )
          start = int(re.search(r"ROUTE_ENTRY_Z = (-?\d+)", source).group(1))
          end = int(re.search(r"ROUTE_END_Z = (-?\d+)", source).group(1))
          assert start - end >= 150, f"Cave route too short: {start - end} blocks"
          print(f"Validated 4 dry cave routes (3 claustrophobic tunnels plus the separate fourth cave), {start - end} blocks between entry and final cavern, clean per-run regeneration.")
          PY
      - name: Validate dungeon access items and cave boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          required = [
              "private boolean upgradeOrCreateMarkedItem",
              "inventory.getStorageContents()",
              "inventory.getItemInOffHand()",
              "if (found) return true;",
              "private void addDecoratedCaveEdgeWalls",
              "addDecoratedCaveEdgeWalls(blocks, mapIndex, z, routeX, width, seed)",
              "A closed, decorated boundary wall follows the local terrain around the whole final cavern.",
              "Closed, solid perimeter walls follow the grotto",
          ]
          missing = [item for item in required if item not in source]
          assert not missing, f"Missing item/wall behavior: {missing}"
          assert source.count("ensureSpecialItems(") == 2, (
              "Expected one declaration and one call at adventure start; duplicate issue calls remain"
          )
          assert "Material.WATER" not in source, "Dungeon generator must stay dry"
          print("Validated: exactly-once access item checks, continuous cave edge walls, side-grotto walls and dry maps.")
          PY
      - name: Validate six elevation-changing cave routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          import re

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          centers = re.search(r"MAP_CENTERS = [{]([^}]+)[}]", source)
          names = re.search(r"MAP_NAMES = [{]([^}]+)[}]", source)
          assert centers and names, "Dungeon map registry not found"
          assert len([x for x in centers.group(1).split(",") if x.strip()]) == 6, "Expected exactly six map regions"
          assert len(re.findall(r'"[^"]+"', names.group(1))) == 6, "Expected exactly six named maps"

          required = [
              "private double smoothCaveProfile",
              "private int caveFloorY",
              "int floorY = caveFloorY(mapIndex, z);",
              "for (int y = 37; y < floorY; y++) put(blocks, x, y, z, underfloor);",
              "for (int y = 37; y < floorY - 1; y++) put(blocks, x, y, z, underfloor);",
              "for (int y = 37; y < localFloor; y++)",
              "caveFloorY(selectedMapIndex, BOSS_Z) + 1",
              "caveFloorY(mapIndex, spawnZ) + 1",
              "int floorY = caveFloorY(mapIndex, localZ);",
              "int localFloor = caveFloorY(mapIndex, wallZ);",
          ]
          missing = [item for item in required if item not in source]
          assert not missing, f"Missing terrain-following cave logic: {missing}"
          assert "Material.WATER" not in source, "Dungeon generator must stay dry"

          entry, end, base = 23, -134, 69
          profiles = [
              lambda t: -13.0 * math.sin(math.pi*t)**2 + 1.45*math.sin(4*math.pi*t)*math.sin(math.pi*t),
              lambda t: -15.5 * math.sin(math.pi*t)**2 + 1.65*math.sin(6*math.pi*t)*math.sin(math.pi*t),
              lambda t: -14.0 * math.sin(math.pi*t)**2 + 1.80*math.sin(8*math.pi*t)*math.sin(math.pi*t),
              lambda t: -18.0 * math.sin(math.pi*t)**2 + 2.25*math.sin(10*math.pi*t)*math.sin(math.pi*t),
              lambda t: -16.0 * math.sin(math.pi*t)**2 + 2.00*math.sin(8*math.pi*t)*math.sin(math.pi*t),
              lambda t: -19.0 * math.sin(math.pi*t)**2 + 2.40*math.sin(12*math.pi*t)*math.sin(math.pi*t),
          ]
          for index, profile in enumerate(profiles):
              heights = []
              for z in range(entry, end - 1, -1):
                  t = max(0.0, min(1.0, (entry - z)/(entry-end)))
                  height = base + math.floor(profile(t) + 0.5)
                  if 0.08 < t < 0.92:
                      phase = (z * 37 + index * 11) % 19
                      if phase == 0: height -= 1
                      elif phase == 2: height += 1
                  heights.append(height)
              assert heights[0] == base and heights[-1] == base, f"Map {index} entry/exit mismatch"
              assert min(heights) <= 56, f"Map {index} does not descend enough"
              assert max(abs(a-b) for a,b in zip(heights, heights[1:])) <= 2, f"Map {index} has an abrupt vertical break"
              assert any(b < a for a,b in zip(heights, heights[1:])), f"Map {index} has no descent"
              assert any(b > a for a,b in zip(heights, heights[1:])), f"Map {index} has no ascent"

          print("Validated six dry cave maps, gradual descents, rough natural floor transitions, solid underfloor and terrain-aware mob spawns.")
          PY
      - name: Validate claustrophobic horror tunnel geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          import math

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          required = [
              "private void addClaustrophobicTunnelDecor",
              "addClaustrophobicTunnelDecor(blocks, mapIndex, z, routeX, width, floorY, seed)",
              "int base = mapIndex == 0 ? 4 : mapIndex == 1 ? 4 : 5;",
              "return Math.max(floorY + 5,",
              "int grottoReach = mapIndex <= 2 ? 8 : 15;",
              "int grottoHalfSpan = mapIndex <= 2 ? 5 : 8;",
              "int radiusX = mapIndex <= 2 ? 15 : 20;",
              "int radiusZ = mapIndex <= 2 ? 13 : 18;",
              "Material.POINTED_DRIPSTONE",
              "Material.SOUL_LANTERN",
              "lampPhase == 0 || lampPhase == 1",
              "Material.GLOW_LICHEN",
              "roughPhase == 0",
          ]
          missing = [item for item in required if item not in source]
          assert not missing, f"Missing narrow-cave construction: {missing}"

          def floor_mod(a, m):
              return a % m

          def chamber_expansion(z):
              return max((12 - abs(z - c) for c in (-20, -43, -66, -89, -111, -127) if abs(z-c) < 12), default=0)

          for map_index in range(3):
              widths = []
              clearances = []
              for z in range(30, -135, -1):
                  seed = 123456789
                  base = 4 if map_index < 2 else 5
                  rock_variation = floor_mod(z * 31 + seed, 3)
                  throat_phase = floor_mod(z + (seed >> 11) + map_index * 17, 47)
                  squeeze = 1 if throat_phase < 9 else 0
                  encounter_room = min(2, chamber_expansion(z) // 6)
                  width = max(3, base + rock_variation + encounter_room - squeeze)
                  widths.append(width)

                  arch = 1.0
                  height = 6 if map_index == 1 else 5
                  noise = floor_mod(z * 17 + seed, 2)
                  chamber_lift = min(1.5, chamber_expansion(z) / 8.0)
                  throat_phase = floor_mod(z + (seed >> 8) + map_index * 19, 67)
                  throat = max(0.0, 1.0 - abs(throat_phase - 33) / 9.0)
                  roof_clearance = max(5, 3 + math.floor(arch * (height + chamber_lift) + 0.5) + noise - math.floor(throat * 2.0 + 0.5))
                  clearances.append(roof_clearance)
              assert min(widths) >= 3 and max(widths) <= 9, f"Map {map_index} corridor width escaped compact range"
              assert min(clearances) >= 5 and max(clearances) <= 12, f"Map {map_index} ceiling is no longer low"
              assert max(widths) - min(widths) >= 2, f"Map {map_index} lacks width variation/choke points"

          assert "int base = 13;" in source, "The separate wide-cave profile was changed"
          print("Validated three narrow horror tunnels, two additional themed caves, varied choke widths, decorative lighting and a separate bone-and-sculk cave.")
          PY
      - name: Validate class shops, skill duration cap and dungeon encounters
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          for archetype in ("mage", "warrior", "ranger", "guardian"):
              assert f'case "{archetype}" -> List.of(' in source, f"Missing {archetype} shop"
          assert source.count("new ShopProduct(") == 48, "Expected 12 distinct products for each of four classes"
          assert "shopProducts(getString(p, classKey, \"\"))" in source, "Shop purchases must use the selected class"
          assert "available.remove(previousMap)" in source, "Consecutive identical maps are not excluded"
          assert "private Material caveUnderfloor" in source and "case 5 ->" in source, "Sixth cave material profile missing"

          start = source.index("private void castAbility")
          end = source.index("private void quest", start)
          ability_code = source[start:end]
          assert "private int skillEffectTicks" in source and "Math.min(300" in source, "15-second skill cap missing"
          assert ability_code.count("new PotionEffect(") == ability_code.count("skillEffectTicks("), (
              "A player-skill potion effect is not routed through the 300-tick cap"
          )

          required_encounters = [
              'member.sendTitle("§6§lВОЛНА "',
              'member.sendTitle("§4§lБОСС"',
              "private void startBossPulse",
              "onDungeonBossPhaseDamage",
              "bossPhaseKey",
              "Attribute.KNOCKBACK_RESISTANCE",
              "private void removePartyMember",
              "pendingPortalLeaders",
              "partyMembers.get(pendingLeader).size() < 3",
              "private static final int[] ENCOUNTER_Z = {-20, -43, -66, -89, -111};",
              "wave >= 5",
          ]
          missing = [name for name in required_encounters if name not in source]
          assert not missing, f"Missing wave/boss mechanics: {missing}"
          print("Validated four class-specific 12-item shops, no consecutive map repeats, 300-tick skill effects, five waves, three-player portal parties and a phased boss.")
          PY
      - name: Validate decorative cave lighting, protected blocks and boss balance
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          required = [
              "private void addCaveLighting",
              "addCaveLighting(blocks, mapIndex, z, routeX, width, floorY, seed)",
              "Material.LANTERN",
              "Material.SEA_LANTERN",
              "Material.AMETHYST_CLUSTER",
              "Material.COPPER_GRATE",
              "protectDungeonBlocks",
              "protectDungeonPlacement",
              "protectDungeonBuckets",
              "protectDungeonBucketPickup",
              "protectDungeonExplosions",
              "protectDungeonBlockExplosions",
              'equals("AstralNexusDungeon")',
              "setBaseValue(160.0)",
              "setBaseValue(8.0)",
              "setBaseValue(6.0)",
              "setBaseValue(0.27)",
              "owner.damage(phase >= 3 ? 4.0 : phase == 2 ? 3.0 : 2.0, boss)",
              "long interval = phase >= 3 ? 8_000L : phase == 2 ? 10_000L : 12_000L",
              "setBaseValue(nextPhase == 3 ? 12.0 : 10.0)",
              "setBaseValue(nextPhase == 3 ? 0.31 : 0.29)",
              "return isPublicResourcePackUrl(configured) ? configured : DEFAULT_RESOURCE_PACK_URL;",
              "registerIncomingPluginChannel(this, MENU_CHANNEL, this)",
              "public void onPluginMessageReceived(String channel, Player player, byte[] message)",
              "private void addVoidSafetyFloor",
              "put(blocks, x, 36, z, Material.BARRIER)",
              "void rescueFallingPlayer(Player player)",
              "ellipse <= 1.56",
              "edge < 0.76 || edge > 1.45",
          ]
          missing = [item for item in required if item not in source]
          assert not missing, f"Missing lighting/protection/balance changes: {missing}"
          assert "setBaseValue(220.0)" not in source, "Previous boss health remains"
          assert "setBaseValue(13.0)" not in source, "Previous boss attack damage remains"
          assert "PotionEffectType.WITHER, 40, 0" not in source, "Final boss phase still applies Wither"
          config = Path("src/main/resources/config.yml").read_text(encoding="utf-8")
          assert 'public-url: ""' in config, "Default config must not ask for a server IP"
          assert "resource-pack.server-port" not in config, "Resource pack must not reserve an extra server port"
          assert "https://raw.githubusercontent.com/sos-create/Plagin1/main/resource-pack/AstralNexus-ResourcePack-1.35.0.zip" in source
          assert "new InetSocketAddress(" not in source, "Plugin must not start a second network listener"
          assert "final int minY = 36, maxY = 112" in source, "Regeneration must clear the previous safety floor"
          print("Validated online HTTPS resource delivery without a public game-server IP or extra port, plugin menu channel, protected maps and weaker 160-HP boss.")
          PY
      - name: Validate isolated dungeon kill rewards
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          start = source.index("private void rewardMonsterKill")
          end = source.index("public void onMobKill", start)
          reward = source[start:end]
          assert "killer == null || !killer.isOnline() || !active(killer)" in reward
          assert "addCoins(killer, coinReward);" in reward
          assert 'progressQuests(killer, "kill", 1);' in reward
          assert 'getString(killer, questKey, "").equals("hunt")' in reward

          start = source.index("public void onMobKill(EntityDeathEvent event)")
          end = source.index("@EventHandler", start + 20)
          normal_kill = source[start:end]
          assert "dungeonManager.isManagedMob(event.getEntity())" in normal_kill
          assert "rewardMonsterKill(killer, 10, 20);" in normal_kill

          start = source.index("public void onDungeonMobDeath(EntityDeathEvent event)")
          end = source.index("@EventHandler", start + 20)
          dungeon_kill = source[start:end]
          assert "mob.getWorld() != dungeonWorld" in dungeon_kill
          assert "participants.contains(killer.getUniqueId())" in dungeon_kill
          assert "killer.getWorld().equals(mob.getWorld())" in dungeon_kill
          assert "rewardMonsterKill(killer, 35, 20);" in dungeon_kill
          assert "remaining.put(id, left);" in dungeon_kill
          print("Validated: normal and dungeon kills cannot double-pay; only active members of the assigned run receive dungeon XP/coins and quest progress.")
          PY
      - name: Validate security and server-load guards
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          assert "resetDungeonWorldOnce" not in source
          assert "Files.walk(worldFolder)" not in source
          assert "Existing AstralNexusDungeon world data will be preserved" in source
          assert source.count("public void onRpgDamage(") + source.count("public void onAstralDamage(") == 1, (
              "Vitality damage must be reduced by exactly one handler"
          )
          assert "message.length != 0" in source and "menuMessageCooldowns.put" in source, (
              "Client menu payload must be empty and rate limited"
          )
          for marker in (
              'if (!p.hasPermission("astralnexus.use") || !dungeonManager.isDungeon(p))',
              'if (!player.hasPermission("astralnexus.use") || !dungeonManager.isDungeon(player))',
              "boolean startButton = holder instanceof MenuHolder",
              "if (!active(p) && !startButton)",
              "if (!active(player) || !player.hasPermission(\"astralnexus.use\"))",
              "|| !active(player)) return;",
              "!isDungeon(member) || !active(member)",
              "isDungeon(member) && active(member)",
              "cooldowns.put(player.getUniqueId(), now + 500L)",
              "protectDungeonTeleport",
              "cleanupOperatorWorldExit",
              "EventPriority.MONITOR, ignoreCancelled = true",
              "int y = destination.getBlockY();",
              "y < 36 || y > 112",
              "preventBoundItemStorage",
              "preventBoundItemDrag",
              "preventBoundItemDrop",
              "preventBoundItemHopperMove",
              "preventBoundItemHopperPickup",
              "preventBoundItemEntityUse",
              "org.bukkit.inventory.meta.BundleMeta",
              "org.bukkit.inventory.meta.BlockStateMeta",
              "org.bukkit.block.ShulkerBox",
              "containsAstralBoundItem(ItemStack item)",
              "stripAstralBoundItems(ItemStack item)",
              "bundleInteraction && carryingBound",
              "containsAstralBoundItem(event.getOldCursor())",
              "preventBoundShulkerPlacement",
              "mapBuildQueue.addLast(mapIndex)",
              "activeMapBuild != -1",
          ):
              assert marker in source, f"Missing hardening guard: {marker}"
          assert "enderChest.getSize()" in source and "stripAstralBoundItems(oldItem)" in source
          assert "shulker.getInventory().getContents()" in source and "bundle.setItems(cleanedContents)" in source
          assert "blockMeta.setBlockState(shulker)" in source
          print("Validated non-destructive startup, live GUI permission/world checks, teleport boundaries, recursive bundle/shulker bound-item cleanup and transfer protection, payload throttling and serialized cave builds.")
          PY
      - name: Validate workflow token permissions
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/build.yml").read_text(encoding="utf-8")
          assert "permissions:\n  contents: read" in workflow, (
              "Default workflow token permissions must stay read-only"
          )
          publish_start = workflow.index("  publish-resource-pack:")
          publish_job = workflow[publish_start:]
          assert "permissions:\n      contents: write" in publish_job, (
              "Only the resource-pack publishing job may receive write permission"
          )
          build_job = workflow[workflow.index("  build:"):publish_start]
          assert "git push origin HEAD:main" not in build_job, (
              "Build/test job must never push to the repository"
          )
          print("Validated: build and PR checks use a read-only token; write permission is isolated to the protected main-branch resource-pack publish job.")
          PY
      - name: Validate automatic optional resource-pack prompt
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          join_start = source.index("public void onJoin(PlayerJoinEvent event)")
          join_end = source.index("@EventHandler", join_start + 30)
          join_handler = source[join_start:join_end]
          assert "sendResourcePack(p)" in join_handler, "Resource-pack prompt is not sent after login"
          assert "if (resourcePackSha1 != null)" in join_handler
          send_start = source.index("private void sendResourcePack(Player player)")
          send_end = source.index("private String getResourcePackUrl()", send_start)
          send_method = source[send_start:send_end]
          assert "setResourcePack(url, resourcePackSha1, false," in send_method, (
              "Resource pack must remain optional so declining does not block the player"
          )
          assert "Component.text(" in send_method, "Minecraft consent prompt text is missing"
          assert "if (resourcePackSha1 != null) sendResourcePack(player);" not in source, (
              "A second automatic prompt is still sent when a dungeon run starts"
          )
          print("Validated: optional Minecraft Yes/No prompt is sent after player login exactly once.")
          PY
      - name: Validate wave and boss spawns on all six maps
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("src/main/java/ru/soscreate/astralnexus/AstralNexusPlugin.java").read_text(encoding="utf-8")
          centers = re.search(r"MAP_CENTERS = [{]([^}]+)[}]", source)
          names = re.search(r"MAP_NAMES = [{]([^}]+)[}]", source)
          encounters = re.search(r"ENCOUNTER_Z = [{]([^}]+)[}]", source)
          boss = re.search(r"BOSS_Z = (-?[0-9]+)", source)
          assert centers and names and encounters and boss, "Map or encounter registry missing"
          center_values = [int(x.strip()) for x in centers.group(1).split(",")]
          map_names = re.findall(r'"[^"]+"', names.group(1))
          encounter_z = [int(x.strip()) for x in encounters.group(1).split(",")]
          assert len(center_values) == 6 and len(map_names) == 6, "All six named maps must have map centers"
          assert len(encounter_z) == 5, "Every map must provide five wave encounter locations"
          assert len(set(center_values)) == 6, "Map centers must not overlap"

          reserve_start = source.index("private int reserveRandomMap")
          reserve_end = source.index("private boolean claimExistingMap", reserve_start)
          assert "i < MAP_CENTERS.length" in source[reserve_start:reserve_end], "Not all six maps are selectable"

          route_start = source.index("private void addLongCaveRoute")
          route_end = source.index("private void addVoidSafetyFloor", route_start)
          route = source[route_start:route_end]
          assert "addFinalSanctum(blocks, centerX, mapIndex, seed)" in route, "Boss arena is not built for each map index"

          spawn_start = source.index("private void spawnWave(Player player)")
          spawn_end = source.index("private void spawnWaveFormation", spawn_start)
          wave_flow = source[spawn_start:spawn_end]
          assert "wave >= 5" in wave_flow and "BOSS_Z" in wave_flow, "Five waves do not lead to the final boss"
          assert "spawnDungeonMob(leader, org.bukkit.entity.EntityType.WITHER_SKELETON" in wave_flow, "Final boss spawn missing"
          assert "ENCOUNTER_Z[currentWave]" in wave_flow, "Wave spawn points are not selected from the encounter table"

          formation_start = source.index("private void spawnWaveFormation")
          formation_end = source.index("private void spawnDungeonMob", formation_start)
          formation = source[formation_start:formation_end]
          assert "if (mapIndex <= 2)" in formation, "Narrow maps are not using compact encounter formations"
          assert "* 2.25" in formation and "* 2.5" in formation, "Compact formation spacing changed unexpectedly"
          assert "cavePathOffset(mapIndex, spawnZ)" in formation, "Spawn x does not follow the curved tunnel at each row"
          assert "caveFloorY(mapIndex, spawnZ)" in formation, "Spawn y does not follow the local floor at each row"
          assert "cavePathOffset(mapIndex, arenaZ)" in formation, "Wide maps lost their normal front-line formation"

          def chamber_expansion(z):
              chambers = encounter_z + [int(boss.group(1))]
              return max(0, max(12 - abs(z - chamber) for chamber in chambers))

          def narrow_half_width(map_index, z):
              base = 4 if map_index < 2 else 5
              room = min(2, chamber_expansion(z) // 6)
              return max(3, base + room - 1)  # Worst case: no width bonus and one-block throat squeeze.

          wave_counts = (4, 5, 6, 6, 7)
          for map_index in range(3):
              for arena_z, count in zip(encounter_z, wave_counts):
                  rows = (count + 2) // 3
                  for row in range(rows):
                      spawn_z = arena_z + round((row - (rows - 1) / 2) * 2.5)
                      row_size = min(3, count - row * 3)
                      farthest_x = max(abs((column - (row_size - 1) / 2) * 2.25)
                                       for column in range(row_size))
                      assert farthest_x + 0.5 < narrow_half_width(map_index, spawn_z), (
                          f"Wave {arena_z} on {map_names[map_index]} can spawn mobs in a side wall"
                      )
                      assert abs(spawn_z - arena_z) <= 3, "Compact formation escaped its encounter pocket"

          for map_index in range(3, 6):
              for arena_z in encounter_z:
                  wide_half_width = 13 + chamber_expansion(arena_z) // 2
                  assert 7.5 + 0.5 < wide_half_width, (
                      f"Wide map {map_names[map_index]} cannot fit the widest wave"
                  )

          assert "caveFloorY(selectedMapIndex, BOSS_Z) + 1" in wave_flow
          assert "cavePathOffset(selectedMapIndex, BOSS_Z)" in wave_flow
          assert "remaining.put(id, 1)" in wave_flow, "Boss death is not registered as the final objective"
          print("Validated all six maps: five encounter positions and final boss; compact formations fit all five waves on the three narrow caves; wide maps retain their full front line.")
          PY
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstralNexusRPG-Paper-1.21.4
          path: build/libs/*.jar

      - name: Upload exact resource pack for publishing
        uses: actions/upload-artifact@v4
        with:
          name: AstralNexusRPG-ResourcePack-Build
          path: src/main/resources/resource-pack.zip
          if-no-files-found: error

  publish-resource-pack:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download exact resource pack embedded in the plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: AstralNexusRPG-ResourcePack-Build
          path: .publish-resource-pack
      - name: Publish versioned resource pack
        run: |
          set -euo pipefail
          mkdir -p resource-pack
          target="resource-pack/AstralNexus-ResourcePack-1.35.0.zip"
          cp .publish-resource-pack/resource-pack.zip "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m "Publish Astral Nexus 1.35.0 resource pack"
            git push origin HEAD:main
          fi
